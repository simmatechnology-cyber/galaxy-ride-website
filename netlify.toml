[build]
  publish   = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# Local dev server (npm run dev → netlify dev)
[dev]
  port       = 8888
  envFile    = ".env"
  autoLaunch = false

[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

# Firebase Auth handler proxy — required so Firebase SDK can use
# galaxyride.in as the authDomain instead of firebaseapp.com.
# When signInWithPopup opens https://galaxyride.in/__/auth/handler,
# Netlify transparently serves it from the Firebase project endpoint.
[[redirects]]
  from   = "/__/auth/*"
  to     = "https://galaxyride-4f219.firebaseapp.com/__/auth/:splat"
  status = 200
  force  = true

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options           = "DENY"
    X-XSS-Protection          = "1; mode=block"
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "geolocation=(self), microphone=(), camera=()"

# CORS headers for API functions
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin  = "*"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"

# Correct MIME type for the PWA manifest (was being served as
# application/octet-stream, which browsers reject under X-Content-Type-Options: nosniff)
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Explicit favicon MIME type for maximum crawler/browser compatibility
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Content-Type = "image/x-icon"
